spring:
  application:
    name: campusmart-backend

# Server configuration
server:
  port: 8080

# Profiles
---
# Development profile (application-dev.yml)
---
spring:
  config:
    activate:
      on-profile: dev

# PostgreSQL development defaults (use Docker container or local instance)
  datasource:
    url: jdbc:postgresql://localhost:5432/campusmart_dev
    username: ${POSTGRES_USER:campusmart}
    password: ${POSTGRES_PASSWORD:campusmart}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration
flyway:
  enabled: true
  locations: classpath:db/migration

---
# Test profile (application-test.yml)
---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:tc:postgresql://localhost:5432/testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

flyway:
  enabled: true
  locations: classpath:db/migration
